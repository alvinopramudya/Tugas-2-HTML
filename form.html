<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <form action="">
    <h1>Data Diri Siswa</h1>
    <label>Nama Lengkap:</label>
    <input type="text" name="nama" >
<br><br>
    <label>Nomor Induk Asal:</label>
    <input type="number" name="nis" >
<br><br>
    <label>NISN:</label>
    <input type="number" name="nisn" >
<br><br>
    <label>Tanggal Lahir:</label>
    <input type="date" name="tanggal_lahir" >
<br><br>
    <label>jenis Kelamin:</label>
    <input type="radio" name="jenis_kelamin" value="laki-laki">laki-laki
    <input type="radio" name="jenis_kelamin" value="perempuan">Perempuan
<br><br>
    <label>Anak Ke:</label>
    <input type="number" name="anak_ke">
<br><br>
    <label>Status Anak Dalam Keluarga:</label>
    <input type="radio" name="status_anak" value="anak_kandung">Anak Kandung
    <input type="radio" name="status_anak" value="anak_angkat">Anak Angkat
    <input type="radio" name="status_anak" value="lainnya">Lainnya
<br><br>
    <label>Alamat Siswa:</label>
    <input type="text" name="alamat_siswa" >
<br><br>
    <label>No Telepon Siswa:</label>
    <input type="number" name="no_telepon_siswa" >
<br><br>
    <label>Sekolah Asal:</label>
    <input type="text" name="sekolah_asal" >
<h1>Data Orang Tua Kandung</h1>
    <label>Nama Lengkap Ayah:</label>
    <input type="text" name="nama_ayah" >
<br><br>
    <label>Nama Lengkap Ibu:</label>
    <input type="text" name="nama_ibu" >
<br><br>
    <label>Alamat:</label>
    <input type="text" name="alamat" >
<br><br>
    <label>No Telepon:</label>
    <input type="number" name="no_telepon" >
<br><br>
    <label>Pekerjaan Ayah:</label>
    <input type="text" name="pekerjaan_ayah" >
    <label>Pekerjaan Ibu:</label>
    <input type="text" name="pekerjaan_ibu" >
<br><br>
    <label>Pendidikan Terakhir Ayah:</label>
    <input type="text" name="pendidikan_ayah" >
    <label>Pendidikan Terakhir Ibu:</label>
    <input type="text" name="pendidikan_ibu" >
  </form>
</body>
</html
